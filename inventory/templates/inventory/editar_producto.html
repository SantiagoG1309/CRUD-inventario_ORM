{% extends 'inventory/base.html' %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Editar Producto</h2>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_nombre" class="form-label">Nombre</label>
                {{ form.nombre.errors }}
                <input type="text" class="form-control" id="id_nombre" name="nombre" value="{{ producto.nombre }}" required>
            </div>
            <div class="mb-3">
                <label for="id_descripcion" class="form-label">Descripción</label>
                {{ form.descripcion.errors }}
                <textarea class="form-control" id="id_descripcion" name="descripcion" rows="3">{{ producto.descripcion }}</textarea>
            </div>
            <div class="mb-3">
                <label for="id_cantidad" class="form-label">Cantidad</label>
                {{ form.cantidad.errors }}
                <input type="number" class="form-control" id="id_cantidad" name="cantidad" value="{{ producto.cantidad }}" min="0" required>
            </div>
            <div class="mb-3">
                <label for="id_precio" class="form-label">Precio</label>
                {{ form.precio.errors }}
                <input type="number" class="form-control" id="id_precio" name="precio" value="{{ producto.precio }}" min="0" step="0.01" required>
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{% url 'lista_productos' %}" class="btn btn-secondary me-md-2">Cancelar</a>
                <button type="submit" class="btn btn-primary">Actualizar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
