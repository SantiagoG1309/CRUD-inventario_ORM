{% extends 'inventory/base.html' %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Eliminar Producto</h2>
    </div>
    <div class="card-body">
        <p class="alert alert-danger">¿Está seguro que desea eliminar el producto "{{ producto.nombre }}"?</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{% url 'lista_productos' %}" class="btn btn-secondary me-md-2">Cancelar</a>
                <button type="submit" class="btn btn-danger">Confirmar Eliminación</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
